reviews:
  custom_checks:
    - name: "Jira-Akzeptanzkriterien"
      instructions: |
        - Lies den Kontext des verlinkten Jira-Tickets aus dem PR-Titel oder der Beschreibung.
        - Füge am Anfang deines Reviews eine Sektion namens "### 📋 Jira Akzeptanzkriterien" ein.
        - Erstelle einen Kommentar mit den Akzeptanzkriterien und schicke den Kommentar in den PR im Review damit dieser im PR protokolliert ist.
        - Liste dort alle Akzeptanzkriterien aus dem Ticket als Checkliste auf.
        - Prüfe für jedes Kriterium, ob der Code im PR dieses erfüllt. Markiere es exakt wie folgt:
          - ✅ (erfüllt)
          - ❌ (nicht erfüllt)
          - ❓ (unklar oder im Code nicht nachvollziehbar)
        - Wenn ein Kriterium nicht erfüllt (❌) oder unklar (❓) ist, schreibe direkt unter den Punkt einen konkreten Verbesserungsvorschlag oder Hinweis.
