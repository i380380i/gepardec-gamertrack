language: "de-AT"

integrations:
  jira:
    usage: enabled

chat:
  integrations:
    jira:
      usage: enabled

reviews:
  profile: "quiet"

  # Globale Anweisung für den Review-Kommentar
  instructions: |
    1. Suche im PR-Titel, der Beschreibung oder dem Branch-Namen nach einem Jira Issue Key nach dem Muster `LAKWYC-[0-9]+`.
    2. Rufe das entsprechende Jira Ticket über die Jira Integration / den MCP Server ab und extrahiere die Akzeptanzkriterien.
    3. Vergleiche die Code-Änderungen im PR direkt mit jedem einzelnen Akzeptanzkriterium.
    4. Füge am Ende der Review-Zusammenfassung eine Sektion namens "### 📋 Jira Akzeptanzkriterien Checkliste" an.
    5. Formatiere die Kriterien strikt als Markdown-Checkliste:
       - [x] Für vollständig erfüllte Kriterien (inkl. kurzer Erläuterung/Dateireferenz).
       - [ ] Für nicht erfüllte oder unvollständige Kriterien (inkl. Begründung, was fehlt).
    6. Falls das Ticket nicht gefunden wird oder keine Akzeptanzkriterien enthält, gib einen entsprechenden Hinweis aus.

  pre_merge_checks:
    custom_checks:
      - name: "Jira Acceptance Criteria Check"
        mode: "warning"
        instructions: |
          Ermittle den Jira Key LAKWYC-[0-9]+ aus dem PR.
          Rufe das Ticket via Jira/MCP ab.
          Prüfe, ob ALLE definierten Akzeptanzkriterien durch die Änderungen im PR abgedeckt sind.
          Schlage als "warning" an, wenn mindestens ein Akzeptanzkriterium nicht oder nur teilweise erfüllt ist.
